services:
  mongo_db:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: .
    image: nodeapp
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      PORT: "3030"
      MONGODB_URI: "mongodb://mongo_db:27017/dealershipsDB"
    depends_on:
      mongo_db:
        condition: service_healthy

volumes:
  mongo_data: