<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | Best Cars</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css">
<script>
const logout = async (event) => {
  // Prevent the link from navigating before the request finishes.
  event.preventDefault();

  try {
    const response = await fetch("/djangoapp/logout", {
      method: "GET",
      credentials: "same-origin",
    });

    const data = await response.json();

    if (!response.ok || data.userName !== "") {
      throw new Error("Logout was not confirmed.");
    }

    // Clear the username only after Django confirms logout.
    sessionStorage.removeItem("username");

    alert("You have been logged out.");
    window.location.href = "/";
  } catch (error) {
    alert("Could not log out. Check that the server is running and try again.");
  }
};

const checkSession = async () => {
  const container = document.getElementById("loginlogout");
  let username = "";
  try {
    const response = await fetch("/djangoapp/session", { credentials: "same-origin", cache: "no-store" });
    if (!response.ok) throw new Error("Session check failed");
    const session = await response.json();
    username = session.authenticated ? session.userName : "";
    if (username) sessionStorage.setItem("username", username);
    else sessionStorage.removeItem("username");
  } catch (error) {
    container.textContent = "Could not check your login session. Refresh to try again.";
    return;
  }

  container.replaceChildren();

  if (username) {
    const usernameLabel = document.createElement("span");
    usernameLabel.className = "homepage_links";
    usernameLabel.textContent = username;

    const logoutLink = document.createElement("a");
    logoutLink.className = "homepage_links";
    logoutLink.href = "/";
    logoutLink.textContent = "Logout";
    logoutLink.addEventListener("click", logout);

    container.append(usernameLabel, logoutLink);
  } else {
    const links = [
      ["Login", "/login/"],
      ["Register", "/register/"],
    ];

    for (const [label, destination] of links) {
      const link = document.createElement("a");
      link.className = "homepage_links";
      link.href = destination;
      link.textContent = label;

      container.append(link);
    }
  }
};
</script>
</head>
<body class="static-page" onload="checkSession()">
<nav class="navbar navbar-light site-nav" aria-label="Main navigation">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Dealerships</a>
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link active" aria-current="page" href="/">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="/about/">About Us</a></li>
      <li class="nav-item"><a class="nav-link" href="/contact/">Contact Us</a></li>
    </ul>
    <div class="loginlink" id="loginlogout"></div>
  </div>
</nav>
<main class="page-shell home-content">
<div class="card home-card">
  <img src="/static/car_dealership.jpg" class="card-img-top" alt="Cars outside a dealership showroom">
  <div class="banner">
    <h1>Welcome to our Dealerships!</h1>
    <a href="/dealers/" class="btn" style="background-color: aqua;margin:10px">View Dealerships</a>
  </div>
</div>
</main>
</body>
</html>
